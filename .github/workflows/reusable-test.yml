name: Reusable Test Suite and CI Gate

# Suíte de testes e validação contínua com desduplicação de CI no merge da main (SPEC-012).

on:
  workflow_call:
    inputs:
      skip_if_validated:
        description: "Pular execução se o commit já foi aprovado em check run anterior"
        required: false
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar check-runs prévios (Desduplicação de CI)
        id: check-dedup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.skip_if_validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_CHECK=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name == "Test" or .name == "unit-tests" or .name == "Testes unitários") | select(.conclusion == "success") | .id' 2>/dev/null | head -n 1 || true)

          if [ -n "$PREV_CHECK" ]; then
            echo "Commit ${GITHUB_SHA} já validado com sucesso no PR (Check Run ID: ${PREV_CHECK}). Pulando reteste redundante na main."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check-dedup.outputs.skip != 'true'

      - uses: astral-sh/setup-uv@v4
        if: steps.check-dedup.outputs.skip != 'true'

      - name: Instalar dependências (incl. dev = pyright)
        if: steps.check-dedup.outputs.skip != 'true'
        run: uv sync --all-groups

      - name: Tipagem estática (pyright)
        if: steps.check-dedup.outputs.skip != 'true'
        run: uv run pyright src tests

      - name: "Sensores determinísticos de AST (Python Fluente, PYF001-PYF007)"
        if: steps.check-dedup.outputs.skip != 'true'
        run: |
          uv run python -m harness_state.sensors.ast_sensor src/harness_state/

      - name: Testes unitários
        if: steps.check-dedup.outputs.skip != 'true'
        run: uv run pytest tests --no-header -q

      - name: Estilo (ruff + isort)
        if: steps.check-dedup.outputs.skip != 'true'
        run: |
          uv run ruff check src tests
          uv run isort --check-only src tests
