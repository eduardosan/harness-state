name: Spec Guidelines DeepEval Validation

# Validação das diretrizes normativas via DeepEval (chamadas de LLM).
#
# Regra de esteira: as chamadas de LLM acontecem SOMENTE durante a produção
# de um novo release. Este workflow não dispara por PR — ele é chamado por
# `tag-code-evaluation.yml` (push de tag v*, workflow_call) e pode ser
# executado manualmente (workflow_dispatch) quando um release estiver sendo
# produzido. Nos PRs, a suíte `tests/evals/` se autopula pelo skip guard por
# env (ausência de endpoint LLM); o que roda em PR são apenas os testes
# unitários offline (mocks).

on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate-spec:
    name: "Validacao de Diretrizes de Prompt via DeepEval"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar Dependencias com uv
        run: uv sync

      - name: Executar Avaliacao de Diretrizes
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
          OPENAI_BASE_URL: ${{ vars.LLM_INTERNAL_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OLLAMA_API_KEY || 'ollama' }}
          LLM_JUDGE_MODEL: ${{ vars.LLM_JUDGE_MODEL }}
          LLM_JUDGE_FALLBACK_MODEL: ${{ vars.LLM_JUDGE_FALLBACK_MODEL }}
        run: uv run pytest tests/evals/ -v
