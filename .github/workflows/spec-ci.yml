name: Spec Guidelines DeepEval Validation

# Validação paralela das diretrizes normativas via DeepEval e pytest-xdist (-n 4)
# com cache inteligente baseado no hash das especificações e diretrizes.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  guidelines-eval:
    name: "Autoavaliação Paralela de Diretrizes (DeepEval)"
    uses: ./.github/workflows/reusable-spec-ci.yml
    secrets: inherit

