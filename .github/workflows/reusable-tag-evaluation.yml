name: Reusable Tag Code Evaluation and Gate

# Self-validation soberana: avaliação consolidada pré-release com LLM-as-a-Judge
# executado em voto único rápido (< 1 min) sobre o diff da tag candidata.
# Suporta execução in-tree ou avaliação cross-repo parametrizada (SPEC-012).

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag gerada ou versão candidata a ser avaliada (ex: v1.2.0)"
        required: true
        type: string
      target_repo:
        description: "Repositório do spoke a ser avaliado (opcional; vazio indica o repositório atual)"
        required: false
        type: string
        default: ""
      commit_sha:
        description: "SHA exato do commit vinculado à tag (opcional)"
        required: false
        type: string
        default: ""
      fast:
        description: "Executar avaliação consolidada em voto único (< 1 min)"
        required: false
        type: boolean
        default: true
      runs_on:
        description: "Tipo de runner para execução do gate"
        required: false
        type: string
        default: "self-hosted"
    secrets:
      token:
        description: "Token do GitHub App ou GitHub Token com acesso ao target_repo"
        required: false
    outputs:
      status:
        description: "Veredito da avaliação (APPROVED ou REJECTED)"
        value: ${{ jobs.evaluate-tag-release.outputs.status }}
      compliance_score:
        description: "Score de conformidade da release (0-100)"
        value: ${{ jobs.evaluate-tag-release.outputs.compliance_score }}
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a ser avaliada manualmente (ex: v0.4.0)"
        required: true
        type: string
      target_repo:
        description: "Repositório do spoke a ser avaliado (opcional)"
        required: false
        type: string
        default: ""
      commit_sha:
        description: "SHA exato do commit vinculado à tag (opcional)"
        required: false
        type: string
        default: ""
      fast:
        description: "Executar avaliação rápida com voto único"
        required: false
        type: boolean
        default: true
      runs_on:
        description: "Tipo de runner para execução do gate"
        required: false
        type: string
        default: "self-hosted"

env:
  LLM_INTERNAL_BASE_URL: ${{ vars.LLM_INTERNAL_BASE_URL }}
  LLM_EXTERNAL_BASE_URL: ${{ vars.LLM_EXTERNAL_BASE_URL }}
  LLM_DEFAULT_MODEL: ${{ vars.LLM_DEFAULT_MODEL }}
  LLM_JUDGE_MODEL: ${{ vars.LLM_JUDGE_MODEL }}
  LLM_JUDGE_FALLBACK_MODEL: ${{ vars.LLM_JUDGE_FALLBACK_MODEL }}
  PYTHONPATH: src

jobs:
  guidelines-eval:
    name: "Autoavaliação Paralela de Diretrizes (DeepEval)"
    if: inputs.target_repo == ''
    uses: ./.github/workflows/reusable-spec-ci.yml
    secrets: inherit

  evaluate-tag-release:
    name: "LLM-as-a-Judge da Release (Voto Consolidado Único)"
    if: always() && (needs.guidelines-eval.result == 'success' || inputs.target_repo != '')
    needs: guidelines-eval
    runs-on: ${{ inputs.runs_on || 'self-hosted' }}
    timeout-minutes: 15
    outputs:
      status: ${{ steps.judge-step.outputs.status }}
      compliance_score: ${{ steps.judge-step.outputs.compliance_score }}
    steps:
      - name: Checkout com Histórico Completo de Tags
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo != '' && inputs.target_repo || github.repository }}
          token: ${{ secrets.token != '' && secrets.token || github.token }}
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || '' }}
          fetch-depth: 0

      - name: Sincronizar Dependências com uv
        run: |
          uv sync || true
          if ! uv run python -c "import harness_state" >/dev/null 2>&1; then
            uv pip install "git+https://github.com/eduardosan/harness-state.git" || true
          fi

      - name: Determinar Tags e Gerar Diff da Release
        id: release-info
        run: |
          set -e
          CURRENT_TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then
            CURRENT_TAG="${{ inputs.tag }}"
          fi
          echo "tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Avaliando a tag/versao candidata: ${CURRENT_TAG}"

          git fetch --tags --force || true
          mkdir -p release_artifacts

          TARGET_REF="${{ inputs.commit_sha }}"
          if [ -z "${TARGET_REF}" ]; then
            TARGET_REF="HEAD"
          fi
          CURRENT_SHA=$(git rev-parse "${TARGET_REF}")
          echo "commit_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"

          if git rev-parse "${CURRENT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${CURRENT_TAG} encontrada no git (avaliacao pos-tag)."
            PREV_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -A 1 "^${CURRENT_TAG}$" | tail -n 1)
            if [ -n "${PREV_TAG}" ] && [ "${PREV_TAG}" != "${CURRENT_TAG}" ]; then
              echo "Tag anterior identificada: ${PREV_TAG}"
              git diff "${PREV_TAG}...${CURRENT_TAG}" > release_artifacts/release_diff.patch
            else
              echo "Primeira tag ou tag sem antecessora direta. Usando commit da tag."
              git show "${CURRENT_TAG}" > release_artifacts/release_diff.patch
            fi
          else
            echo "Tag ${CURRENT_TAG} e uma versao candidata (pre-release gate)."
            LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [ -n "${LATEST_TAG}" ]; then
              echo "Ultima tag existente no git: ${LATEST_TAG}"
              git diff "${LATEST_TAG}..${TARGET_REF}" > release_artifacts/release_diff.patch
            else
              echo "Nenhuma tag anterior encontrada. Gerando diff completo da arvore."
              git diff $(git hash-object -t tree /dev/null).."${TARGET_REF}" > release_artifacts/release_diff.patch
            fi
          fi
          echo "Diff gerado com $(wc -l < release_artifacts/release_diff.patch) linhas."

      - name: "Autoavaliação LLM-as-a-Judge Fast Consolidada"
        id: judge-step
        env:
          OPENAI_BASE_URL: ${{ vars.LLM_INTERNAL_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OLLAMA_API_KEY || secrets.OPENAI_API_KEY || 'ollama' }}
          LLM_API_KEY: ${{ secrets.OLLAMA_API_KEY || secrets.OPENAI_API_KEY || 'ollama' }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
          DEEPEVAL_PER_ATTEMPT_TIMEOUT_SECONDS_OVERRIDE: "600"
        run: |
          FAST_FLAG=""
          if [ "${{ inputs.fast }}" = "true" ]; then
            FAST_FLAG="--fast"
          fi
          SPEC_ARG=""
          if [ -f docs/architecture/code-evaluation-flow.md ]; then
            SPEC_ARG="--spec docs/architecture/code-evaluation-flow.md"
          fi
          uv run python -m harness_state.judge \
            $FAST_FLAG \
            $SPEC_ARG \
            --diffs release_artifacts/release_diff.patch \
            --spec-id "TAG-${{ steps.release-info.outputs.tag }}" \
            --out-file release_artifacts/evaluation_report.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload dos Artefatos de Avaliação da Tag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-evaluation-report-${{ steps.release-info.outputs.tag }}
          path: release_artifacts/evaluation_report.json

      - name: Emitir Status API e Validar Veredito da Tag
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
        run: |
          STATUS="${{ steps.judge-step.outputs.status }}"
          SCORE="${{ steps.judge-step.outputs.compliance_score }}"
          echo "Veredito da Release: ${STATUS} (Score: ${SCORE}/100)"

          if [ -n "${{ inputs.target_repo }}" ]; then
            COMMIT_SHA="${{ steps.release-info.outputs.commit_sha }}"
            STATE="success"
            DESC="Tag gate aprovado pelo Harness Judge"
            if [[ "${STATUS}" != "APPROVED" ]]; then
              STATE="failure"
              DESC="Tag gate reprovado pelo Harness Judge (score ${SCORE}/100)"
            fi
            echo "Registrando status API no commit ${COMMIT_SHA} de ${{ inputs.target_repo }}..."
            gh api "repos/${{ inputs.target_repo }}/statuses/${COMMIT_SHA}" \
              -f state="${STATE}" \
              -f context="flywheel/tag-gate" \
              -f description="${DESC}" || echo "Aviso: Falha ao registrar Commit Status via GitHub API"
          fi

          if [[ "${STATUS}" != "APPROVED" ]]; then
            echo "::error::Gate de autoavaliacao da tag reprovou a conformidade da versao!"
            exit 1
          fi
          echo "Release aprovada integralmente no Gate de Autoavaliacao de Codigo!"
