name: Tag and Release from Main (post-squash only)

# SPEC-006 Onda 2 (D3.4) — release público AGPL-3.0, tag cortada no SHA
# pós-squash da main (nunca head de PR).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de incremento SemVer (patch, minor, major)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4

      - name: Calcular próxima tag SemVer (Conventional Commits)
        id: semver
        env:
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          TITLE="${COMMIT_TITLE:-$(git log -1 --pretty=%s github.sha)}"
          BUMP="${{ inputs.bump || 'patch' }}"
          case "$TITLE" in
            *BREAKING*|"feat:"|"feat("*) OUT=minor ;;
            *!*) OUT=major ;;
            *) OUT=patch ;;
          esac
          if [ -n "$BUMP" ] && [ "$BUMP" != "patch" ]; then OUT="$BUMP"; fi
          echo "bump=$OUT" >> "$GITHUB_OUTPUT"

      - name: Sincronizar versão do pacote com a tag
        id: tag
        env:
          BUMP: ${{ steps.semver.outputs.bump }}
        run: |
          BASE_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          NEXT=$(python3 - "$BASE_VERSION" "$BUMP" <<'PY'
          import sys
          major, minor, patch = (int(x) for x in sys.argv[1].split("."))
          kind = sys.argv[2]
          if kind == "major":
              print(f"{major + 1}.0.0")
          elif kind == "minor":
              print(f"{major}.{minor + 1}.0")
          else:
              print(f"{major}.{minor}.{patch + 1}")
          PY
          )
          TAG="v$NEXT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG já existe — release idempotente."
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincronizar versão no pyproject
        if: steps.tag.outputs.tag != ''
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.tag.outputs.tag#v }}\"/" pyproject.toml
          grep "^version = " pyproject.toml

      - name: Build wheel e sdist
        if: steps.tag.outputs.tag != ''
        run: uv build

      - name: Criar tag anotada no SHA da main
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "${{ github.sha }}" -m "Release $TAG"
          git push origin "$TAG"

      - name: Criar GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
