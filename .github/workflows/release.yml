name: Tag and Release from Main (post-squash only)

# SPEC-006 Onda 2 (D3.4) — release público AGPL-3.0, tag cortada no SHA
# pós-squash da main (nunca head de PR). Bump por Conventional Commits,
# versão do pacote sincronizada com a tag antes do build.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de incremento SemVer (patch, minor, major)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # Racional (SPEC-006, diretriz final do operador, decisão A: REUSAR o
  # agentic-harness): o produtor DESPACHA `agent-run` (target = este repo)
  # e cria a issue de release-eval; o flywheel roda `just verify` + deepeval
  # no SELF-HOSTED local e devolve `repository_dispatch release-gate-result`;
  # o workflow `release-cut.yml` corta a tag quando chega success.
  # (A tentativa de `uses: workflow_call privado` foi recusada no load pelo
  # próprio GitHub — reusable privado não pode ser chamado cross-repo.)
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-groups
      - name: Tipagem estática (pyright)
        run: uv run pyright src tests
      - name: Testes unitários
        run: uv run pytest tests --no-header -q

  public-surface-smoke:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-groups
      - name: Build wheel e sdist
        run: uv build
      - name: Instalar wheel em venv hermético e validar superfície pública
        run: |
          uv venv /tmp/public-cli
          VIRTUAL_ENV=/tmp/public-cli uv pip install dist/*.whl
          /tmp/public-cli/bin/harness --help | grep -qE "get-spec|status|update"
          /tmp/public-cli/bin/harness get-spec --help

  dispatch-harness-complete:
    name: "Disparar avaliação completa (agentic-harness)"
    needs: [tests, public-surface-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Criar labels do ciclo de execução (idempotente)
        env:
          GH_TOKEN: ${{ secrets.FLYWHEEL_DISPATCH_TOKEN }}
        run: |
          gh label create agent-run --repo "$GITHUB_REPOSITORY" --color 1D76DB --description "Execução da esteira federada via Agentic Flywheel (SDD)" --force
          gh label create agent-spec --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "PR de sub-spec federada (SDD)" --force

      - name: Abrir issue de release-eval
        id: abrir-issue
        env:
          GH_TOKEN: ${{ secrets.FLYWHEEL_DISPATCH_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          ISSUE_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "release-eval: núcleo ${GITHUB_SHA::7} (harness completo)" \
            --label agent-run,agent-spec \
            --body "Avaliação completa deste release pela aplicação Agentic Flywheel. Rastreio: ${{ github.server_url }}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          ISSUE_NUMBER="${ISSUE_URL##*/}"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: repository_dispatch agent-run ao flywheel
        env:
          GH_TOKEN: ${{ secrets.FLYWHEEL_DISPATCH_TOKEN }}
          ISSUE_NUMBER: ${{ steps.abrir-issue.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          gh api \
            "repos/eduardosan/agentic-flywheel/dispatches" \
            -X POST \
            -f event_type=agent-run \
            -f "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[issue_number]=${ISSUE_NUMBER}" \
            -f "client_payload[spec_id]=SPEC-007" \
            -f "client_payload[origin]=release-gate" \
            -f "client_payload[origin_run_id]=${RUN_ID}" \
            -f "client_payload[sha]=${SHA}"

