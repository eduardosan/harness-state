name: Tag and Release from Main (post-squash only)

# SPEC-006 / SPEC-009G: Release público desacoplado e reutilizável.
# O fluxo principal delega a execução para o workflow reutilizável canônico
# `reusable-release.yml` (que executa evals paralelos com cache e fast judge)
# e, após o corte da tag, notifica o repositório consumidor `agentic-flywheel`.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de incremento SemVer (patch, minor, major)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: "Esteira Reutilizável de Release"
    uses: ./.github/workflows/reusable-release.yml
    with:
      bump: ${{ inputs.bump || 'patch' }}
    secrets: inherit

  notify-flywheel:
    name: "Notificar repositório do Flywheel (core-released)"
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Gerar token de instalação da GitHub App (dispatch cross-repo ao flywheel)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: eduardosan

      - name: repository_dispatch core-released ao flywheel (o consumidor bumpa a versão do núcleo)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/eduardosan/agentic-flywheel/dispatches" \
            -X POST \
            -f event_type=core-released \
            -f "client_payload[version]=${TAG#v}" \
            -f "client_payload[conclusion]=success" \
            -f "client_payload[eval_sha]=${SHA}"

  notify-slackbot:
    name: "Disparar deploy no Slack Bot (core-released)"
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Gerar token de instalação da GitHub App (dispatch cross-repo ao slackbot)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: eduardosan

      - name: repository_dispatch core-released ao slackbot (dispara deploy atualizado)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/eduardosan/harness-slack-bot/dispatches" \
            -X POST \
            -f event_type=core-released \
            -f "client_payload[version]=${TAG#v}" \
            -f "client_payload[conclusion]=success" \
            -f "client_payload[eval_sha]=${SHA}"
