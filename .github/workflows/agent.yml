name: Agent Dispatch

# Repo alvo apenas delega para o workflow centralizado com vendoring e dispara o hub (agentic-flywheel).
on:
  issues:
    types: [labeled]

jobs:
  dispatch:
    # bots (ex.: eduardo-harness-agent[bot]) NÃO acionam o relay — o
    # release do núcleo já despacha agent-run diretamente (SPEC-006
    # call-and-back); este relay é para o operador etiquetar manualmente.
    if: >-
      github.event.label.name == 'agent-run' &&
      !endsWith(github.event.sender.login, '[bot]')
    permissions:
      contents: read
      id-token: write
      actions: write
    uses: paralax-ia/actions-workflows/.github/workflows/agent-dispatch.yml@main
    secrets:
      FLYWHEEL_DISPATCH_TOKEN: ${{ secrets.FLYWHEEL_DISPATCH_TOKEN }}
